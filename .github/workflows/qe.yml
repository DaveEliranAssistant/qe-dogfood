name: QE product dogfood
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Trusted base ref for removal/baseline comparison
        required: true
        default: main
      demo_fourth_product:
        description: Include an explicitly synthetic fourth-product demo result
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: qe-dogfood-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    name: Collect five real suite runs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test && npm run typecheck
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Five runs; only the named intentional race may fail
        run: npm run collect
        env:
          DOGFOOD_SEED: qe-dogfood-v1
      - name: Preserve exact PR-head contract
        run: node -e "require('fs').copyFileSync('openapi.json','reports/openapi-head.json')"
      - name: Upload every real XML, JSON scan and run result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qe-raw-evidence
          path: reports/
          if-no-files-found: error
          retention-days: 14
  products:
    name: Product reports
    needs: collect
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Trusted baseline and product tooling from the base revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'main' }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Immutable FlakeLens CLI contribution (PR 4)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: DaveEliranAssistant/flakelens
          ref: e0a76acf21b83a0cb4b73ee82035582ed8488e1b
          path: flakelens
          persist-credentials: false
      - name: Immutable reviewed SpecGate adapter snapshot (no private token)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 730d79836899b7e3f8591db682da8277a29f6d7c
          path: report-tools
          persist-credentials: false
      - name: Install FlakeLens locked dependencies without lifecycle scripts
        working-directory: flakelens
        run: npm ci --ignore-scripts
      - name: Download actual test evidence
        id: evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qe-raw-evidence
          path: evidence
      - name: Create product report directory
        run: mkdir product-reports
      - name: FlakeLens shared parser, scorer and report
        id: flakelens
        working-directory: flakelens
        run: node --import tsx scripts/cli.ts --json ../product-reports/flakelens.json --markdown ../product-reports/flakelens.md ../evidence/junit-*.xml
      - name: A11yGate new, fixed, still-open findings and PR comment
        id: a11y
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        continue-on-error: true
        uses: DaveEliranAssistant/a11ygate-action@1158465f2f6260df1868c7c389a18f8e430b5b93
        with:
          current: evidence/axe-results.json
          baseline: trusted/a11y-baseline.json
          threshold: minor
          target-label: QE Dogfood Demo
          markdown: product-reports/a11ygate.md
          json: product-reports/a11ygate.json
          comment: 'false'
      - name: SpecGate exact path and operation removals only
        id: specgate
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        continue-on-error: true
        run: node report-tools/vendor/specgate/cli.mjs --base trusted/openapi.json --head evidence/openapi-head.json --json product-reports/specgate.json --markdown product-reports/specgate.md
      - name: Upload a11ygate native report
        id: upload_a11y
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qe-native-a11ygate
          path: |
            product-reports/a11ygate.json
            product-reports/a11ygate.md
            product-reports/qe-result-a11ygate.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload flakelens native report
        id: upload_flakelens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qe-native-flakelens
          path: |
            product-reports/flakelens.json
            product-reports/flakelens.md
            product-reports/qe-result-flakelens.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload specgate native report
        id: upload_specgate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qe-native-specgate
          path: |
            product-reports/specgate.json
            product-reports/specgate.md
            product-reports/qe-result-specgate.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload product reports even when gates fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qe-product-reports
          path: product-reports/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce actual product gate outcomes (no false green)
        if: always()
        run: node trusted/scripts/enforce.mjs
        env:
          FLAKELENS_OUTCOME: ${{ steps.flakelens.outcome }}
          A11YGATE_OUTCOME: ${{ steps.a11y.outcome }}
          SPECGATE_OUTCOME: ${{ steps.specgate.outcome }}
      - name: Optional synthetic fourth-product contract demonstration
        if: ${{ always() && (inputs.demo_fourth_product == true || github.head_ref == 'demo/consolidated-fourth-product') }}
        run: |
          mkdir -p product-reports
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('product-reports/qe-result-demo-fourth.json',JSON.stringify({schemaVersion:1,product:'DemoFourthProduct',version:'demo-only',verdict:'pass',headline:'Synthetic contract demonstration only; not a real product check',metrics:[{label:'demo',value:1}],findings:[],runUrl:process.env.RUN_URL}));"
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Upload synthetic fourth-producer evidence
        id: upload_fourth
        if: ${{ always() && (inputs.demo_fourth_product == true || github.head_ref == 'demo/consolidated-fourth-product') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qe-native-demo-fourth
          path: product-reports/qe-result-demo-fourth.json
          if-no-files-found: error
          retention-days: 14
      - name: Consolidated QE Atlas Report
        if: always()
        uses: DaveEliranAssistant/qe-atlas-report@d9acdcf93160d97a0a673c798f82c94cd9b0d08c
        with:
          results: product-reports/qe-result*.json
          expected-files: |
            product-reports/qe-result-a11ygate.json
            product-reports/qe-result-flakelens.json
            product-reports/qe-result-specgate.json
          mode: report-only
          target-label: QE Dogfood Demo
          require-artifact-links: 'true'
          artifact-links: |
            {"product-reports/qe-result-a11ygate.json":"${{ steps.upload_a11y.outputs.artifact-url }}","product-reports/qe-result-flakelens.json":"${{ steps.upload_flakelens.outputs.artifact-url }}","product-reports/qe-result-specgate.json":"${{ steps.upload_specgate.outputs.artifact-url }}","product-reports/qe-result-demo-fourth.json":"${{ steps.upload_fourth.outputs.artifact-url }}"}
          html-url: ${{ vars.QE_REPORT_HTML_PREVIEWS == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('{0}/pr-{1}/report.html', vars.QE_REPORT_PREVIEW_BASE_URL, github.event.pull_request.number) || '' }}
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

  preview:
    name: Optional fork-safe HTML preview
    needs: products
    if: ${{ always() && !cancelled() && vars.QE_REPORT_HTML_PREVIEWS == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: qe-report-pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: qe-report-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Immutable trusted preview renderer; never execute application code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: DaveEliranAssistant/qe-atlas-report
          ref: d9acdcf93160d97a0a673c798f82c94cd9b0d08c
          path: reporter
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Re-render latest available open-PR JSON reports into numeric preview paths
        run: node reporter/src/preview.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QE_PREVIEW_DIRECTORY: preview-site
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: preview-site
      - name: Deploy optional HTML previews
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
