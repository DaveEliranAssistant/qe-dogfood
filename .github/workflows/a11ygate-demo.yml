name: A11yGate demo shop

# Scans the static shop when a pull request changes it.
# The action is the copy on main of https://github.com/DaveEliranAssistant/a11ygate/tree/main/action
on:
  pull_request:
    paths:
      - 'a11ygate-demo/**'
      - '.github/workflows/a11ygate-demo.yml'

permissions:
  contents: read

jobs:
  scan:
    name: Scan demo shop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Install demo scan tools
        working-directory: a11ygate-demo
        run: npm ci
      - name: Install Chromium
        working-directory: a11ygate-demo
        run: npx playwright install --with-deps chromium
      - name: Write axe results without failing the scan
        working-directory: a11ygate-demo
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a11ygate-demo-axe
          path: a11ygate-demo/a11y-results/home.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: A11yGate regression gate
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # pull-requests: write is required for the comment API on this repository.
    # issues: write alone returned 403 in earlier same-repo dogfood.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: a11ygate-demo-axe
          path: a11y-results
      # No baseline file: the accepted shop has no axe violations, so every
      # finding is new. A baseline captured on another machine is treated as
      # incomparable coverage and exits 2.
      - name: Fail on new violations and comment on the pull request
        uses: DaveEliranAssistant/a11ygate/action@main
        with:
          current: a11y-results/home.json
          threshold: serious
          comment: true
          markdown: a11y-results/summary.md
          json: a11y-results/gate.json
